name: Refresh web lockfile (temporary)
# Re-resolves apps/web dependencies after merging main (Babylon.js 9 + SignalR)
# and commits package-lock.json; removed right after.
on:
  push:
    branches: [feature/two-player-rooms-20261030]
    paths: [.github/workflows/refresh-web-lockfile.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --no-audit --no-fund
        working-directory: apps/web
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/refresh-web-lockfile.yml
          git add apps/web/package-lock.json
          git commit -m "Refresh apps/web lockfile after merging main; remove the temporary workflow"
          git push
