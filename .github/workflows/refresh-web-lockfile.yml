name: Refresh web lockfile (temporary)
# Runs on this upgrade branch only: resolves apps/web dependencies and commits
# the updated package-lock.json (the authoring sandbox cannot reach npm).
on:
  push:
    branches: [feature/tech-upgrade-20261030]
    paths: [apps/web/package.json, .github/workflows/refresh-web-lockfile.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --no-audit --no-fund
        working-directory: apps/web
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "Update apps/web lockfile for Babylon.js 9 [skip ci]" || echo "lockfile unchanged"
          git push
