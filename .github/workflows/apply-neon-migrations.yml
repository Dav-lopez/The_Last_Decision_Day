name: Apply Neon database migrations (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type APPLY to confirm applying committed EF Core migrations to the configured Neon database'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: the-last-decision-neon-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'APPLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check required secret
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATION_CONNECTION_STRING }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure repository Actions secret NEON_MIGRATION_CONNECTION_STRING with a direct Neon Npgsql connection string."
            exit 1
          fi
          if [[ "$DATABASE_URL" == *"-pooler."* ]]; then
            echo "::error::Use the direct Neon hostname for migrations, not the -pooler hostname."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore project and EF Core tool
        run: |
          dotnet restore services/api/TheLastDecision.Api.csproj
          dotnet tool restore
      - name: Apply committed migrations
        env:
          ConnectionStrings__GameDb: ${{ secrets.NEON_MIGRATION_CONNECTION_STRING }}
        run: dotnet ef database update --project services/api/TheLastDecision.Api.csproj --startup-project services/api/TheLastDecision.Api.csproj
      - name: Finished
        run: echo "Migration command completed. Verify the Render /api/v1/health/ready endpoint."
