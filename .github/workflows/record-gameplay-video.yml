name: Record gameplay video
# Runs when this media branch is pushed. Builds the game, films a scripted
# guest tour in headless Chrome and commits the result back to the branch
# (and the log, so a failed run can be read without downloading CI logs).
on:
  push:
    branches: [media/football-preview]
    paths: [tools/video/**, .github/workflows/record-gameplay-video.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the game and the recorder
        run: |
          mkdir -p media
          {
            npm --prefix apps/web install
            npm --prefix tools/video install playwright
            npx --prefix tools/video playwright install --with-deps chromium
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          } 2>&1 | tee media/log.txt
      - name: Build the game
        run: npm --prefix apps/web run build 2>&1 | tee -a media/log.txt
      - name: Film the tour
        run: |
          MODE=$(cat tools/video/MODE)
          (cd apps/web && npx vite preview --host 127.0.0.1 --port 4173 --strictPort > ../../media/preview-server.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          node tools/video/football.mjs http://127.0.0.1:4173/ video-out preview 2>&1 | tee -a media/log.txt
      - name: Encode the video
        if: always()
        run: |
          if false; then
            python3 tools/video/encode.py video-out media/the-last-decision-gameplay.mp4 2>&1 | tee -a media/log.txt
          else
            cp video-out/preview-*.jpg video-out/page.txt media/ 2>/dev/null || true
          fi
      - name: Commit the result (or the log) to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          tail -c 200000 media/log.txt > media/log.tail.txt 2>/dev/null || true
          rm -f media/log.txt
          git add media
          git commit -m "media: $(cat tools/video/MODE) render (${{ job.status }}) [skip ci]" || echo "nothing new"
          git push
