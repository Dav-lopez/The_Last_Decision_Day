name: CI
on:
  push:
  pull_request:
jobs:
  facial-asset-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject invalid generated facial GLB fixtures
        run: python scripts/test_facial_asset_contract.py
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore services/api/TheLastDecision.Api.csproj
      - run: dotnet build services/api/TheLastDecision.Api.csproj --no-restore
      - run: dotnet tool restore
      - run: dotnet ef --version
      - run: dotnet run --project tests/IdentityRules.Tests/IdentityRules.Tests.csproj
      - run: dotnet run --project tests/SchoolRules.Tests/SchoolRules.Tests.csproj
      - run: dotnet run --project tests/LifeRules.Tests/LifeRules.Tests.csproj
      - run: dotnet run --project tests/Multiplayer.Tests/Multiplayer.Tests.csproj
      - run: dotnet run --project tests/AuditFoundation.Tests/AuditFoundation.Tests.csproj
      - run: dotnet run --project tests/Observability.Tests/Observability.Tests.csproj
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:movement
      - run: npm run test:appearance
      - run: npm run test:human
      - run: npm run test:emotion
      - run: node --test tests/facial-droplets.test.mjs
      - run: npm run test:character
      - run: npm run test:online
      - run: npm run test:environment
      - run: npm run build
      - name: Test Cloudflare Pages API proxy
        run: node --test tests/pages-proxy.test.mjs
      - name: Test school time rollover rules
        run: node --test tests/school-time.test.mjs tests/school-actions.test.mjs
      - name: Bundle Cloudflare Pages Functions
        run: npx --yes wrangler@4.45.0 pages functions build functions --outfile /tmp/tld-pages-worker.mjs
  web-playtest:
    # A headless browser plays the guest demo end to end and fails on runtime errors.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx vite build
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: Serve the build
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
      - name: Play the guest demo
        run: node tests/e2e/playtest.mjs http://localhost:4173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-screenshots
          path: apps/web/playtest-output
          if-no-files-found: ignore
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local stack
        run: docker compose up --build -d
      - name: Pre-migration smoke test
        run: bash tests/smoke-pre-migration.sh
      - name: Verify Docker Data Protection volume survives API restart
        run: bash tests/smoke-dataprotection.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Tear down containers (preserve volumes)
        if: always()
        run: docker compose down
  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tld_migration_ci
          POSTGRES_USER: tld_ci
          POSTGRES_PASSWORD: ci_only_not_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tld_ci -d tld_migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__GameDb: Host=localhost;Port=5432;Database=tld_migration_ci;Username=tld_ci;Password=ci_only_not_production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore services/api/TheLastDecision.Api.csproj
      - run: dotnet tool restore
      - name: Apply pre-ledger migrations to disposable PostgreSQL
        run: dotnet ef database update 20261024093500_SchoolActivityReadIndex --project services/api/TheLastDecision.Api.csproj --startup-project services/api/TheLastDecision.Api.csproj
      - name: Seed a legacy completed action before ledger migration
        run: dotnet run --project tests/PostgresIntegration.Tests/PostgresIntegration.Tests.csproj -- --seed-legacy-school
      - name: Validate committed migration and apply to disposable PostgreSQL
        run: bash scripts/verify-ef-migration.sh
      - name: Test PostgreSQL gameplay persistence and historical backfill
        env:
          TEST_LEGACY_BACKFILL: '1'
        run: dotnet run --project tests/PostgresIntegration.Tests/PostgresIntegration.Tests.csproj
