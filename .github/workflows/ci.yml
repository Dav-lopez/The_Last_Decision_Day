name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore services/api/TheLastDecision.Api.csproj
      - run: dotnet build services/api/TheLastDecision.Api.csproj --no-restore
      - run: dotnet tool restore
      - run: dotnet ef --version
      - run: dotnet run --project tests/IdentityRules.Tests/IdentityRules.Tests.csproj
      - run: dotnet run --project tests/SchoolRules.Tests/SchoolRules.Tests.csproj
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local stack
        run: docker compose up --build -d
      - name: Pre-migration smoke test
        run: bash tests/smoke-pre-migration.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Tear down containers (preserve volumes)
        if: always()
        run: docker compose down
  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tld_migration_ci
          POSTGRES_USER: tld_ci
          POSTGRES_PASSWORD: ci_only_not_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tld_ci -d tld_migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__GameDb: Host=localhost;Port=5432;Database=tld_migration_ci;Username=tld_ci;Password=ci_only_not_production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore services/api/TheLastDecision.Api.csproj
      - run: dotnet tool restore
      - name: Validate committed migration and apply to disposable PostgreSQL
        run: bash scripts/verify-ef-migration.sh
