name: Who Did That - Flask Multiplayer CI
on:
  pull_request:
    paths:
      - "games/who-did-that/**"
      - ".github/workflows/who-did-that.yml"
  push:
    paths:
      - "games/who-did-that/**"
      - ".github/workflows/who-did-that.yml"
jobs:
  multiplayer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/who-did-that
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Check backend and frontend syntax
        run: |
          python -m py_compile app.py
          node --check public/app.js
      - name: Run multiplayer game integration tests
        run: python -m unittest discover -s test -p "test_*.py" -v
      - name: Start Flask and verify health endpoint
        run: |
          python app.py > /tmp/who-did-that.log 2>&1 &
          GAME_PID=$!
          trap 'kill $GAME_PID || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:3000/health", timeout=3) as r:
                      assert r.status == 200
                      print(r.read().decode())
                      break
              except Exception:
                  time.sleep(0.25)
          else:
              raise RuntimeError("Health check did not respond")
          PY
