name: Propose generated facial model PR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-character.py'
      - 'scripts/facial_*.py'
      - 'scripts/hair_detail.py'
      - 'scripts/test_hair_detail.py'
      - 'scripts/validate_hair_detail_glb.py'
      - '.github/workflows/propose-facial-model.yml'
concurrency:
  group: facial-model-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  propose-model:
    # A manual dispatch must target main; never publish assets generated from an unmerged feature branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify procedural mouth geometry
        run: python scripts/test_facial_mouth.py
      - name: Verify expression-responsive facial surface geometry
        run: |
          python scripts/test_facial_smile_folds.py
          python scripts/test_facial_brows.py
          python scripts/test_facial_eyelids.py
          python scripts/test_facial_cornea.py
          python scripts/test_facial_cheeks.py
          python scripts/test_facial_nose.py
          python scripts/test_facial_ears.py
      - name: Verify head-skinned oral interior geometry
        run: python scripts/test_facial_oral.py
      - name: Verify bilateral eye-gaze geometry
        run: python scripts/test_facial_gaze.py
      - name: Verify head-skinned eyebrow fibre morphs
        run: python scripts/test_facial_brows.py
      - name: Verify bilateral corneal film geometry
        run: python scripts/test_facial_cornea.py
      - name: Verify procedural droplet geometry
        run: python scripts/test_facial_droplets.py
      - name: Unit-test generated facial asset contract
        run: python scripts/test_facial_asset_contract.py
      - name: Unit-test dual-body release parity
        run: python scripts/test_facial_release_parity.py
      - name: Unit-test bounded skinned hair detail
        run: python scripts/test_hair_detail.py
      - name: Build pinned-source facial model
        run: python scripts/build-character.py
      - name: Verify skinned hair-fibre geometry on both bodies
        run: python scripts/validate_hair_detail_glb.py apps/web/public/models/human.glb apps/web/public/models/human-female.glb
      - name: Enforce generated facial asset contract for both bodies
        run: |
          python scripts/facial_asset_contract.py apps/web/public/models/human.glb
          python scripts/facial_asset_contract.py apps/web/public/models/human-female.glb
          python scripts/facial_release_parity.py
      # The release-parity gate above already checks both binaries, their
      # manifests, actual morph displacement, Head skinning, brow budgets,
      # nasolabial folds, eyelids, cornea and matching animation clips.
      # Avoid a second, male-only validator with stale hard-coded vertex counts.
      - name: Validate generated facial rigs on both bodies
        run: |
          python scripts/validate-face-glb.py apps/web/public/models/human.glb
          python scripts/validate-face-glb.py apps/web/public/models/human-female.glb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Babylon test dependencies
        run: npm --prefix apps/web install
      - name: Verify generated GLB imports in Babylon
        run: node --test apps/web/tests/generated-face.test.mjs
      - name: Upload validated male and female model candidates for visual review
        uses: actions/upload-artifact@v4
        with:
          name: facial-model-candidate
          path: |
            apps/web/public/models/human.glb
            apps/web/public/models/human.source.json
            apps/web/public/models/human-female.glb
            apps/web/public/models/human-female.source.json
          if-no-files-found: error
          retention-days: 14
      - name: Open draft PR containing the actual GLB
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: generated/facial-human-glb
          base: main
          delete-branch: false
          draft: true
          commit-message: 'assets: regenerate human.glb with facial morph targets'
          title: 'assets: ship male and female generated facial GLBs'
          body: |
            Generated automatically after a reviewed character-generator change reached main, or by a manual dispatch on main, from pinned SHA-verified CC0 sources.
            Includes both male and female GLBs plus matching SHA-256 manifests. Each contains separated lip ribbons, a head-skinned oral cavity/teeth/tongue, cheek, eyebrow-fibre, eyelid, corneal film, head-skinned tear/sweat morph targets and capped skinned hair-fibre relief on all six hairstyles, existing skeleton and Idle/Walk/Run clips.
            Please review the GLB visually and run web tests before manually merging.
            This is stylized geometry, not a photorealistic head.
          add-paths: |
            apps/web/public/models/human.glb
            apps/web/public/models/human.source.json
            apps/web/public/models/human-female.glb
            apps/web/public/models/human-female.source.json
