name: Propose generated facial model PR
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  propose-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pinned-source facial model
        run: python scripts/build-character.py
      - name: Validate model structure and animation
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          p = Path('apps/web/public/models/human.glb')
          raw = p.read_bytes()
          assert raw[:4] == b'glTF' and struct.unpack_from('<I', raw, 8)[0] == len(raw)
          n = struct.unpack_from('<I', raw, 12)[0]
          d = json.loads(raw[20:20+n])
          assert d['asset']['version'] == '2.0'
          assert d.get('skins') and {'Idle', 'Walk', 'Run'} <= {a['name'] for a in d['animations']}
          expected = {'eyeBlinkLeft','eyeBlinkRight','eyeWideLeft','eyeWideRight','browInnerUp','browDownLeft','browDownRight'}
          found = set()
          for mesh in d['meshes']:
              names = mesh.get('extras', {}).get('targetNames', [])
              for primitive in mesh['primitives']:
                  if names:
                      assert len(primitive.get('targets', [])) == len(names), mesh['name']
              found.update(names)
          assert expected <= found, f'Missing facial morphs: {expected - found}'
          # A morph with the correct name but zero vertex movement is not usable.
          binary_start = 28 + n
          for mesh in d['meshes']:
              names = mesh.get('extras', {}).get('targetNames', [])
              for primitive in mesh['primitives']:
                  for name, target in zip(names, primitive.get('targets', [])):
                      accessor = d['accessors'][target['POSITION']]
                      assert accessor['componentType'] == 5126 and accessor['type'] == 'VEC3'
                      view = d['bufferViews'][accessor['bufferView']]
                      offset = binary_start + view.get('byteOffset', 0) + accessor.get('byteOffset', 0)
                      stride = view.get('byteStride', 12)
                      assert offset + (accessor['count'] - 1) * stride + 12 <= len(raw)
                      magnitude = max(
                          max(abs(v) for v in struct.unpack_from('<fff', raw, offset + i * stride))
                          for i in range(accessor['count'])
                      )
                      assert magnitude > 0.0001, f'{mesh["name"]}: {name} has no visible displacement'
          print('Verified facial morph targets contain nonzero geometry displacement')
          print(f'Validated {p.stat().st_size} bytes, {len(found)} facial morph names, skeletal animation')
          PY
      - name: Open draft PR containing the actual GLB
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: generated/facial-human-glb
          base: main
          delete-branch: false
          draft: true
          commit-message: 'assets: regenerate human.glb with facial morph targets'
          title: 'assets: ship generated facial human.glb'
          body: |
            Generated by a manually dispatched workflow from pinned, SHA-verified CC0 sources.
            Contains seven real geometry morph targets, existing skeleton and Idle/Walk/Run clips.
            Please review the GLB visually and run web tests before manually merging.
            This is stylized geometry, not a photorealistic head.
          add-paths: |
            apps/web/public/models/human.glb
