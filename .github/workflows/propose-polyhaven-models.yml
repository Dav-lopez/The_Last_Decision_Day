name: Propose Poly Haven models PR
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  propose-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download, verify and convert CC0 models
        run: python tools/assets/polyhaven_fetch.py
      - name: Install web test dependencies
        run: npm --prefix apps/web install
      - name: Validate manifest, files and prop layout
        run: node --test apps/web/tests/polyhaven-props.test.mjs
      - name: Verify every model imports in Babylon
        run: node --test apps/web/tests/polyhaven-import.test.mjs
      - name: Open draft PR containing the models
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: generated/polyhaven-models
          base: ${{ github.ref_name }}
          delete-branch: false
          draft: true
          commit-message: 'assets: add Poly Haven CC0 props and furniture'
          title: 'assets: ship Poly Haven CC0 props and furniture'
          body: |
            Downloaded from Poly Haven by a manually dispatched workflow. Every file was MD5-checked,
            converted to a self-contained GLB (quantized geometry, WebP textures) and imported in Babylon.
            See `apps/web/public/models/polyhaven/manifest.json` for the chosen assets and sizes.
            Please look at the street in a browser (porch plants, school benches) and check each prop's
            orientation before merging. Furniture slots are included for the upcoming home interior.
          add-paths: |
            apps/web/public/models/polyhaven/**
