name: Build facial character GLB
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-character.py'
      - 'scripts/facial_mouth.py'
      - 'scripts/facial_oral.py'
      - 'scripts/test_facial_oral.py'
      - 'scripts/facial_gaze.py'
      - 'scripts/test_facial_gaze.py'
      - 'scripts/test_facial_mouth.py'
      - 'scripts/facial_cheeks.py'
      - 'scripts/facial_nose.py'
      - 'scripts/facial_ears.py'
      - 'scripts/test_facial_ears.py'
      - 'scripts/hair_detail.py'
      - 'scripts/test_hair_detail.py'
      - 'scripts/validate_hair_detail_glb.py'
      - 'scripts/facial_brows.py'
      - 'scripts/test_facial_brows.py'
      - 'scripts/facial_eyelids.py'
      - 'scripts/facial_cornea.py'
      - 'scripts/test_facial_cornea.py'
      - 'scripts/facial_release_parity.py'
      - 'scripts/test_facial_release_parity.py'
      - 'scripts/test_facial_eyelids.py'
      - 'scripts/test_facial_nose.py'
      - 'scripts/test_facial_cheeks.py'
      - 'scripts/facial_droplets.py'
      - 'scripts/test_facial_droplets.py'
      - 'scripts/validate-face-glb.py'
      - '.github/workflows/build-facial-character.yml'
permissions:
  contents: read
jobs:
  build-character:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit-test mouth, cheek and droplet morph geometry
        run: |
          python scripts/test_facial_mouth.py
          python scripts/test_facial_oral.py
          python scripts/test_facial_gaze.py
          python scripts/test_facial_cheeks.py
          python scripts/test_facial_nose.py
          python scripts/test_facial_ears.py
          python scripts/test_hair_detail.py
          python scripts/test_facial_brows.py
          python scripts/test_facial_eyelids.py
          python scripts/test_facial_cornea.py
          python scripts/test_facial_release_parity.py
          python scripts/test_facial_droplets.py
      - name: Generate character from pinned licensed sources
        run: python scripts/build-character.py
      - name: Validate skinned hair-fibre detail on both bodies
        run: python scripts/validate_hair_detail_glb.py apps/web/public/models/human.glb apps/web/public/models/human-female.glb
      - name: Verify male/female facial release parity
        run: python scripts/facial_release_parity.py
      - name: Inspect facial rig
        run: |
          python scripts/validate-face-glb.py apps/web/public/models/human.glb
          python scripts/validate-face-glb.py apps/web/public/models/human-female.glb
          python - <<'PY'
          import json, struct
          from pathlib import Path
          raw = Path('apps/web/public/models/human.glb').read_bytes()
          n = struct.unpack_from('<I', raw, 12)[0]
          d = json.loads(raw[20:20+n])
          expected = {'eyeBlinkLeft','eyeBlinkRight','eyeWideLeft','eyeWideRight','browInnerUp','browDownLeft','browDownRight',
                      'mouthSmileLeft','mouthSmileRight','mouthFrownLeft','mouthFrownRight','mouthPressLeft','mouthPressRight','jawOpen','mouthOpen',
                      'cheekSquintLeft','cheekSquintRight',
                      'eyeLookDownLeft','eyeLookDownRight','eyeLookUpLeft','eyeLookUpRight',
                      'tearTrackLeft','tearTrackRight','sweatTrackLeft','sweatTrackRight'}
          found = set()
          for mesh in d.get('meshes', []):
              found.update(mesh.get('extras', {}).get('targetNames', []))
          assert expected <= found, f'Missing new facial targets: {expected - found}'
          for oral_name in ('Student oral cavity', 'Student upper teeth', 'Student tongue'):
              oral = next(mesh for mesh in d['meshes'] if mesh['name'] == oral_name)
              assert any(n.get('mesh') == d['meshes'].index(oral) and n.get('skin') == 0 for n in d['nodes'])
          cheeks = next(mesh for mesh in d['meshes'] if mesh['name'] == 'Student expressive cheeks')
          assert cheeks['extras']['targetNames'] == ['cheekSquintLeft', 'cheekSquintRight']
          assert len(cheeks['primitives'][0]['targets']) == 2
          material = d['materials'][cheeks['primitives'][0]['material']]
          assert material['name'] == 'Student cheek blush' and material['alphaMode'] == 'BLEND'
          assert material['pbrMetallicRoughness']['baseColorFactor'][3] == 0
          for kind in ('tear', 'sweat'):
              for side in ('Left', 'Right'):
                  label = f'Student {kind} {side}'
                  droplet = next(mesh for mesh in d['meshes'] if mesh['name'] == label)
                  assert droplet['extras']['targetNames'] == [f'{kind}Track{side}']
                  assert len(droplet['primitives'][0]['targets']) == 1
                  material = d['materials'][droplet['primitives'][0]['material']]
                  assert material['name'] == label and material['alphaMode'] == 'BLEND'
                  assert material['pbrMetallicRoughness']['baseColorFactor'][3] == 0
          brows = next(mesh for mesh in d['meshes'] if mesh['name'] == 'Student eyebrow fibres')
          bp = brows['primitives'][0]
          assert brows['extras']['targetNames'] == ['browInnerUp', 'browDownLeft', 'browDownRight']
          assert len(bp['targets']) == 3 and bp['material'] == 4
          assert d['accessors'][bp['attributes']['POSITION']]['count'] == 168
          assert any(n.get('mesh') == d['meshes'].index(brows) and n.get('skin') == 0 for n in d['nodes'])
          eyelids = next(mesh for mesh in d['meshes'] if mesh['name'] == 'Student eyelid rims')
          eyelid_prim = eyelids['primitives'][0]
          assert eyelids['extras']['targetNames'] == ['eyeBlinkLeft', 'eyeBlinkRight']
          assert len(eyelid_prim['targets']) == 2
          assert eyelid_prim['material'] == 4, 'Lashes must inherit hair color'
          assert d['accessors'][eyelid_prim['attributes']['POSITION']]['count'] >= 100
          assert any(n.get('mesh') == d['meshes'].index(eyelids) and n.get('skin') == 0 for n in d['nodes'])
          cornea = next(mesh for mesh in d['meshes'] if mesh['name'] == 'Student corneal shells')
          cornea_prim = cornea['primitives'][0]
          assert cornea['extras']['targetNames'] == [
              'eyeBlinkLeft', 'eyeBlinkRight', 'eyeLookDownLeft', 'eyeLookDownRight',
              'eyeLookUpLeft', 'eyeLookUpRight']
          assert len(cornea_prim['targets']) == 6
          assert d['accessors'][cornea_prim['attributes']['POSITION']]['count'] >= 200
          assert {'POSITION', 'NORMAL', 'JOINTS_0', 'WEIGHTS_0'} <= set(cornea_prim['attributes'])
          assert any(n.get('mesh') == d['meshes'].index(cornea) and n.get('skin') == 0 for n in d['nodes'])
          film = d['materials'][cornea_prim['material']]
          assert film['name'] == 'Student corneal film' and film['alphaMode'] == 'BLEND'
          assert 0 < film['pbrMetallicRoughness']['baseColorFactor'][3] <= 0.2
          nose = next(mesh for mesh in d['meshes'] if mesh['name'] == 'Student sculpted nose')
          nose_prim = nose['primitives'][0]
          assert nose_prim['material'] == 0, 'Nose must inherit customizable skin material'
          assert {'POSITION', 'NORMAL', 'JOINTS_0', 'WEIGHTS_0'} <= set(nose_prim['attributes'])
          assert d['accessors'][nose_prim['attributes']['POSITION']]['count'] >= 100
          assert any(n.get('mesh') == d['meshes'].index(nose) and n.get('skin') == 0 for n in d['nodes'])
          ears = next(mesh for mesh in d['meshes'] if mesh['name'] == 'Student sculpted ears')
          ear_prim = ears['primitives'][0]
          assert ear_prim['material'] == 0, 'Ears must inherit customizable skin material'
          assert {'POSITION', 'NORMAL', 'JOINTS_0', 'WEIGHTS_0'} <= set(ear_prim['attributes'])
          assert d['accessors'][ear_prim['attributes']['POSITION']]['count'] >= 140
          assert any(n.get('mesh') == d['meshes'].index(ears) and n.get('skin') == 0 for n in d['nodes'])
          assert len(d.get('skins', [])) > 0
          assert {'Idle','Walk','Run'} <= {a['name'] for a in d.get('animations', [])}
          print('Facial geometry, skin and locomotion clips verified')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Babylon test dependencies
        run: npm --prefix apps/web install
      - name: Validate generated morphs in Babylon NullEngine
        run: node --test apps/web/tests/generated-face.test.mjs
      - name: Upload generated model for visual review
        uses: actions/upload-artifact@v4
        with:
          name: human-facial-rig-glb
          path: |
            apps/web/public/models/human.glb
            apps/web/public/models/human-female.glb
            apps/web/public/models/human.source.json
            apps/web/public/models/human-female.source.json
          retention-days: 14
