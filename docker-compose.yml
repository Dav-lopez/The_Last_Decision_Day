services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thelastdecision}
      POSTGRES_USER: ${POSTGRES_USER:-tld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
  api:
    build: {context: ., dockerfile: infrastructure/docker/api.Dockerfile}
    environment:
      ASPNETCORE_URLS: http://+:8080
      DataProtection__KeysDirectory: /app/keys
      ConnectionStrings__GameDb: Host=postgres;Database=${POSTGRES_DB:-thelastdecision};Username=${POSTGRES_USER:-tld};Password=${POSTGRES_PASSWORD:-change-this-local-password}
    depends_on: {postgres: {condition: service_healthy}}
    volumes: [api_data_protection_keys:/app/keys]
  web:
    build: {context: ., dockerfile: infrastructure/docker/web.Dockerfile}
  proxy:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
volumes:
  postgres_data:
  api_data_protection_keys:
