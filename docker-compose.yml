services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thelastdecision}
      POSTGRES_USER: ${POSTGRES_USER:-tld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__GameDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-thelastdecision};Username=${POSTGRES_USER:-tld};Password=${POSTGRES_PASSWORD:-change-this-local-password}
      FeatureFlags__AiAvatarEnabled: "false"
      Security__RequireSecureCookies: "false"
      Database__MigrateOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
volumes:
  postgres_data:
