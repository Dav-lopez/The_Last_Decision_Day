services:
  - type: web
    name: who-did-that-game
    runtime: python
    rootDir: games/who-did-that
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 32 --worker-class gthread --timeout 0 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeployTrigger: off
