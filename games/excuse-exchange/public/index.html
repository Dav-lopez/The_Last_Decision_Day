<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101324" />
  <meta name="description" content="Make ridiculous excuses. Blame absolutely nobody. Win the room. A hilarious live multiplayer party game." />
  <title>The Excuse Exchange — bad excuses, great friends</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="The Excuse Exchange home">
      <span class="brand-icon" aria-hidden="true">!</span>
      <span>THE EXCUSE <strong>EXCHANGE</strong></span>
    </a>
    <div class="header-right"><span class="live-dot" aria-hidden="true"></span><span id="connection-status">Connecting</span></div>
  </header>
  <main id="app" class="app-shell" aria-live="polite">
    <div class="loading">Connecting to the Department of Excuses…</div>
  </main>
  <footer class="site-footer">
    <span>NO GOOD EXCUSES. JUST GREAT STORIES.</span>
    <span>Designed for actual humans and suspicious geese · 2026</span>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
