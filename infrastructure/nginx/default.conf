map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen 80;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location /hubs/ { proxy_pass http://api:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 3600s; proxy_buffering off; }
 location / { proxy_pass http://web:80; proxy_set_header Host $host; }
}